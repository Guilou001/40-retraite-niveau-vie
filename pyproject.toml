[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "rnv"
version = "1.0.0"
description = "Faire durer son épargne sans trop réduire son niveau de vie"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{name = "Guillaume Vaudescal"}]
dependencies = ["gvf[figures]>=0.4.1", "numpy>=2", "pandas>=2.2", "scipy>=1.14", "statsmodels>=0.14", "matplotlib>=3.9", "pyarrow>=17", "duckdb>=1.1", "typer>=0.12", "openpyxl>=3.1", "xlrd>=2", "tabulate>=0.9"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9", "pymupdf>=1.25", "nbformat>=5", "nbclient>=0.10", "ipykernel>=6"]

[tool.uv.sources]
gvf = {git = "https://github.com/Guilou001/gv-fintools", rev = "f77d9566464c5698bfdb9d199f3d2f6a4ec279a3"}

[project.scripts]
rnv = "rnv.cli:app"

[project.urls]
Repository = "https://github.com/Guilou001/40-retraite-niveau-vie"

[tool.hatch.build.targets.wheel]
packages = ["src/rnv"]

[tool.ruff]
target-version = "py312"
line-length = 110
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
